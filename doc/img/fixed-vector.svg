<text class="s" x="18" y="30" font-size="15" font-weight="600">std::vector&lt;point&gt; · point { float x; float y; }</text><text class="s m" x="18" y="62" font-size="12">header, once per message</text><rect x="200" y="46" width="560" height="26" rx="5" fill="#fff" stroke="#d1d9e0"/><text x="212" y="64" font-size="12">[1630, [["x", 85], ["y", 85]]]</text><text class="s m" x="748" y="64" text-anchor="end" font-size="11">tag of point · x, y: float32 LE</text><text class="s m" x="18" y="117" font-size="12">the vector</text><rect x="200" y="100" width="120" height="26" rx="5" fill="#fff" stroke="#d1d9e0" style="animation:hd 9.0s infinite"/><text x="260" y="117" text-anchor="middle" font-size="11">32873 · ref · len</text><text class="s" x="260" y="144" text-anchor="middle" font-size="12" fill="#2da44e" style="animation:ok 9.0s infinite;fill:#2da44e">✓ checked once</text><path d="M260 100 V72" stroke="#59636e" stroke-dasharray="3 3" style="animation:link 9.0s infinite"/><rect x="328" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e0 9.0s infinite"/><line x1="352.0" y1="104" x2="352.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="352.0" y="142" text-anchor="middle" font-size="10">0</text><rect x="380" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e1 9.0s infinite"/><line x1="404.0" y1="104" x2="404.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="404.0" y="142" text-anchor="middle" font-size="10">8</text><rect x="432" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e2 9.0s infinite"/><line x1="456.0" y1="104" x2="456.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="456.0" y="142" text-anchor="middle" font-size="10">16</text><rect x="484" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e3 9.0s infinite"/><line x1="508.0" y1="104" x2="508.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="508.0" y="142" text-anchor="middle" font-size="10">24</text><rect x="536" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e4 9.0s infinite"/><line x1="560.0" y1="104" x2="560.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="560.0" y="142" text-anchor="middle" font-size="10">32</text><rect x="588" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e5 9.0s infinite"/><line x1="612.0" y1="104" x2="612.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="612.0" y="142" text-anchor="middle" font-size="10">40</text><rect x="640" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e6 9.0s infinite"/><line x1="664.0" y1="104" x2="664.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="664.0" y="142" text-anchor="middle" font-size="10">48</text><rect x="692" y="100" width="48" height="26" rx="4" fill="#fff" stroke="#d1d9e0" style="animation:e7 9.0s infinite"/><line x1="716.0" y1="104" x2="716.0" y2="122" stroke="#d1d9e0"/><text class="s m" x="716.0" y="142" text-anchor="middle" font-size="10">56</text><text class="s" x="612.0" y="166" text-anchor="middle" font-size="12" style="animation:p5 9.0s infinite">points[5].y → offset 5 × 8 + 4</text><text class="s" x="328" y="166" font-size="12" style="animation:lp 9.0s infinite">for (auto p : points): raw little-endian floats, no head per element</text>
