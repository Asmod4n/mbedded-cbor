name: macos

on:
  push:
    paths:
      - 'include/**'
      - 'test/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'third_party/**'
      - 'cbor-test-vectors/**'
      - 'test-vectors/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: '26'
            os: macos-26
          - xcode: '27'
            os: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          ls -d /Applications/Xcode*.app
          app=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | grep -viE 'beta|release_candidate' | sort -V | tail -1)
          if [ -z "$app" ]; then
            app=$(ls -d /Applications/Xcode_${{ matrix.xcode }}*.app | sort -V | tail -1)
            echo "Xcode ${{ matrix.xcode }} has no release on this image; the job takes the prerelease $app"
          fi
          if [ -z "$app" ]; then
            echo "The image has no Xcode ${{ matrix.xcode }}"
            exit 1
          fi
          sudo xcode-select -s "$app"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          clang++ --version
      - name: Install doctest, Boost and Ninja
        run: |
          brew install doctest boost ninja
          echo "CPLUS_INCLUDE_PATH=$(brew --prefix)/include" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel "$(sysctl -n hw.ncpu)"
