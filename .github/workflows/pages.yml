name: pages

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'Doxyfile'
      - 'tools/doc/**'
      - 'containers/doxygen.Containerfile'
      - 'doc/reference/**'
      - 'tools/site/**'
      - 'test/doc_types.hpp'
      - 'containers/site.Containerfile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: snapshot
        name: Read the date of Debian sid
        run: |
          echo "snapshot=$(curl -sSf https://deb.debian.org/debian/dists/sid/InRelease | sed -n 's/^Date: //p' | head -1 | date -u -f - +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: image
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/image-site
          key: image-site-${{ steps.snapshot.outputs.snapshot }}-${{ hashFiles('containers/site.Containerfile') }}
      - if: steps.image.outputs.cache-hit != 'true'
        name: Build the image
        run: |
          mkdir -p "$RUNNER_TEMP/image-site"
          podman build -q -t mbedded-cbor-site -f containers/site.Containerfile containers
          podman save -o "$RUNNER_TEMP/image-site/image.tar" mbedded-cbor-site
      - if: steps.image.outputs.cache-hit == 'true'
        name: Load the image
        run: podman load -q -i "$RUNNER_TEMP/image-site/image.tar"
      - id: alpine
        name: Read the date of the Alpine 3.24 package index
        run: |
          echo "index=$(for repo in main community; do curl -sSfI https://dl-cdn.alpinelinux.org/alpine/v3.24/$repo/x86_64/APKINDEX.tar.gz | sed -n 's/^last-modified: //Ip' | tr -d '\r' | date -u -f - +%Y%m%dT%H%M%S; done | sort | tail -1)" >> "$GITHUB_OUTPUT"
      - id: image-doxygen
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/image-doxygen
          key: image-doxygen-${{ steps.alpine.outputs.index }}-${{ hashFiles('containers/doxygen.Containerfile') }}
      - if: steps.image-doxygen.outputs.cache-hit != 'true'
        name: Build the image of Doxygen
        run: |
          mkdir -p "$RUNNER_TEMP/image-doxygen"
          podman build -q -t mbedded-cbor-doxygen -f containers/doxygen.Containerfile containers
          podman save -o "$RUNNER_TEMP/image-doxygen/image.tar" mbedded-cbor-doxygen
      - if: steps.image-doxygen.outputs.cache-hit == 'true'
        name: Load the image of Doxygen
        run: podman load -q -i "$RUNNER_TEMP/image-doxygen/image.tar"
      - name: Build the site
        run: sh tools/site/page.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
