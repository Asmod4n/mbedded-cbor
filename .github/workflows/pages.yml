name: pages

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'Doxyfile'
      - 'tools/doc/**'
      - 'tools/site/**'
      - 'test/doc_types.hpp'
      - 'containers/docs.Containerfile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - id: snapshot
        name: Read the date of Debian sid
        run: |
          echo "snapshot=$(curl -sSf https://deb.debian.org/debian/dists/sid/InRelease | sed -n 's/^Date: //p' | head -1 | date -u -f - +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/image-docs
          key: image-docs-${{ steps.snapshot.outputs.snapshot }}-${{ hashFiles('containers/docs.Containerfile') }}
      - if: steps.image.outputs.cache-hit != 'true'
        name: Build the image
        run: |
          mkdir -p "$RUNNER_TEMP/image-docs"
          podman build -q -t mbedded-cbor-docs -f containers/docs.Containerfile containers
          podman save -o "$RUNNER_TEMP/image-docs/image.tar" mbedded-cbor-docs
      - if: steps.image.outputs.cache-hit == 'true'
        name: Load the image
        run: podman load -q -i "$RUNNER_TEMP/image-docs/image.tar"
      - name: Build the site
        run: sh tools/site/page.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
