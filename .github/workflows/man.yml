name: man

on:
  push:
    branches: [main]
    paths:
      - 'include/cbor/**'
      - 'Doxyfile'
      - 'tools/doc/**'
      - 'tools/man/**'
      - 'test/**'
      - 'containers/docs.Containerfile'
      - 'CMakeLists.txt'
      - '.github/workflows/man.yml'

permissions:
  contents: write

concurrency:
  group: man
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: snapshot
        name: Read the date of Debian sid
        run: |
          echo "snapshot=$(curl -sSf https://deb.debian.org/debian/dists/sid/InRelease | sed -n 's/^Date: //p' | head -1 | date -u -f - +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"
      - id: image
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/image-docs
          key: image-docs-${{ steps.snapshot.outputs.snapshot }}-${{ hashFiles('containers/docs.Containerfile') }}
      - if: steps.image.outputs.cache-hit != 'true'
        name: Build the image
        run: |
          mkdir -p "$RUNNER_TEMP/image-docs"
          podman build -q -t mbedded-cbor-docs -f containers/docs.Containerfile containers
          podman save -o "$RUNNER_TEMP/image-docs/image.tar" mbedded-cbor-docs
      - if: steps.image.outputs.cache-hit == 'true'
        name: Load the image
        run: podman load -q -i "$RUNNER_TEMP/image-docs/image.tar"
      - name: Make the man pages
        run: sh tools/man/man.sh "$RUNNER_TEMP/man"
      - name: Commit the man pages that changed
        run: |
          git rm -r -q man
          cp -r "$RUNNER_TEMP/man" man
          git add -A man
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Make the man pages again'
          git pull -q --rebase origin main
          git push origin HEAD:main
