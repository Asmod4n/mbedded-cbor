name: man

on:
  push:
    paths:
      - 'doc/reference/**'
      - 'doc/man/**'
      - 'tools/man/**'
      - 'containers/man.Containerfile'
      - 'CMakeLists.txt'
      - '.github/workflows/man.yml'
  pull_request:
    paths:
      - 'doc/reference/**'
      - 'doc/man/**'
      - 'tools/man/**'
      - 'containers/man.Containerfile'
      - 'CMakeLists.txt'
      - '.github/workflows/man.yml'

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: podman build -q -t mbedded-cbor-man -f containers/man.Containerfile containers
      - name: Make the man pages and compare them with doc/man/man3
        run: |
          sh tools/man/man.sh "$RUNNER_TEMP/man3"
          diff -r doc/man/man3 "$RUNNER_TEMP/man3"
