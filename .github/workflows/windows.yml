name: windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Take the MSVC environment and the clang-cl of Visual Studio
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Output "Visual Studio: $vs"
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          $llvm = "$vs\VC\Tools\Llvm\x64\bin"
          if (-not (Test-Path "$llvm\clang-cl.exe")) { Write-Output "The image has no clang-cl in $llvm"; exit 1 }
          $llvm >> $env:GITHUB_PATH
          & "$llvm\clang-cl.exe" --version
      - id: vcpkg
        name: Take the version of the vcpkg of the image
        run: |
          "commit=$(git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "archives=$env:LOCALAPPDATA\vcpkg\archives" >> $env:GITHUB_OUTPUT
      - name: Keep the built doctest and its source between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.vcpkg.outputs.archives }}
            ${{ env.VCPKG_INSTALLATION_ROOT }}\downloads
          key: vcpkg-doctest-x64-windows-${{ steps.vcpkg.outputs.commit }}
      - name: Install doctest from the vcpkg of the image
        run: |
          foreach ($attempt in 1..3) {
            & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install doctest:x64-windows
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (30 * $attempt)
          }
          exit 1
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=clang-cl
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build -- -k 0
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS
